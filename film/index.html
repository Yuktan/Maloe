<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1f0">
  <meta name="description" content="Maloe 的胶片影集。按胶片卷翻阅精选照片，有新片时继续更新。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="胶片影集 · Maloe">
  <meta property="og:description" content="从一卷卷胶片里，留下愿意再看一次的片刻。">
  <meta property="og:image" content="https://maloe.xyz/film/assets/full/5203/000012.jpg">
  <link rel="canonical" href="https://maloe.xyz/film/">
  <title>胶片影集 · Maloe</title>
  <link rel="stylesheet" href="gallery.css">
  <link rel="stylesheet" href="/site.css">
  <script src="gallery-data.js" defer></script>
  <script src="gallery.js" defer></script>
</head>
<body class="film-page">
  <a class="skip-link" href="#gallery">跳到照片</a>
  <header class="journal-header">
    <a class="journal-brand" href="/" aria-label="返回 Maloe 首页">maloe<span class="brand-period">.</span></a>
    <nav class="journal-nav" aria-label="网站导航"><a href="/annual/">年度盘点</a><a href="/film/" aria-current="page">胶片影集</a></nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-main">
        <p class="eyebrow"><span class="red-mark" aria-hidden="true"></span> 随时更新的照片记录</p>
        <h1 id="page-title">胶片影集<span class="title-en">Film Archive</span></h1>
      </div>
      <div class="hero-aside">
        <p class="intro">从一卷卷胶片里，留下愿意再看一次的片刻。新照片会继续收进这里，像翻阅一叠不断添页的接触印样。</p>
        <div class="archive-meta"><span><strong id="roll-count">6</strong> 卷胶片</span><span><strong id="photo-count">66</strong> 张照片</span><span>慢慢翻阅</span></div>
      </div>
    </section>

    <section class="archive" id="gallery" aria-labelledby="archive-title">
      <div class="section-top"><div><p class="eyebrow">接触印样</p><h2 id="archive-title">浏览相片</h2></div><p class="section-note">点击照片放大 · 方向键翻页</p></div>
      <div class="roll-filter" id="roll-filter" role="group" aria-label="按胶片卷筛选"></div>
      <div class="gallery-grid" id="gallery-grid"></div>
      <noscript><p class="gallery-empty">请启用 JavaScript 浏览胶片影集。</p></noscript>
      <p class="gallery-empty" id="gallery-empty" hidden>照片还在路上，过些时候再来看看。</p>
      <nav class="pagination" aria-label="照片分页">
        <button type="button" id="previous-page" aria-label="上一页">← 上一页</button>
        <span id="page-status" aria-live="polite">01 / 01</span>
        <button type="button" id="next-page" aria-label="下一页">下一页 →</button>
      </nav>
    </section>
  </main>

  <footer class="journal-footer"><span>Maloe · 胶片影集</span><a href="/">回到首页</a></footer>

  <dialog class="lightbox" id="lightbox" aria-label="照片大图浏览">
    <div class="lightbox-shell">
      <div class="lightbox-top"><span id="lightbox-count"></span><button class="icon-button" id="close-lightbox" type="button" aria-label="关闭大图">×</button></div>
      <div class="lightbox-image-wrap"><img id="lightbox-image" alt="" width="1642" height="2200"></div>
      <div class="lightbox-bottom"><button type="button" id="previous-photo" aria-label="上一张照片">← 上一张</button><span id="lightbox-caption"></span><button type="button" id="next-photo" aria-label="下一张照片">下一张 →</button></div>
    </div>
  </dialog>
</body>
</html>
